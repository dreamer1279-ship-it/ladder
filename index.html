<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사다리타기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = {
    theme: { extend: { fontFamily: { sans: ['"Pretendard Variable"', 'Pretendard', 'system-ui', 'sans-serif'] } } }
  };
</script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-100">
<main class="mx-auto max-w-5xl px-4 py-8 sm:py-12">

  <header class="mb-6 flex items-center gap-3">
    <div class="grid h-11 w-11 place-items-center rounded-xl bg-indigo-600 text-white shadow-lg shadow-indigo-600/20">
      <i data-lucide="dices" class="h-6 w-6"></i>
    </div>
    <div>
      <h1 class="text-2xl font-bold tracking-tight">사다리타기</h1>
      <p id="subtitle" class="text-sm text-slate-500 dark:text-slate-400">이름과 결과를 적고 시작을 눌러 보세요</p>
    </div>
  </header>

  <section class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800 sm:p-6">

    <!-- 도구 모음 -->
    <div class="mb-5 flex flex-wrap items-center gap-2">
      <div id="editTools" class="flex flex-wrap items-center gap-2">
        <div class="flex items-center gap-1 rounded-xl bg-slate-100 p-1 dark:bg-slate-800">
          <span class="flex items-center gap-1.5 px-2 text-sm font-medium text-slate-600 dark:text-slate-300">
            <i data-lucide="users" class="h-4 w-4"></i>인원
          </span>
          <button id="minus" class="grid h-8 w-8 place-items-center rounded-lg transition hover:bg-white disabled:opacity-30 dark:hover:bg-slate-700" aria-label="인원 줄이기">
            <i data-lucide="minus" class="h-4 w-4"></i>
          </button>
          <span id="count" class="w-7 text-center font-semibold tabular-nums">4</span>
          <button id="plus" class="grid h-8 w-8 place-items-center rounded-lg transition hover:bg-white disabled:opacity-30 dark:hover:bg-slate-700" aria-label="인원 늘리기">
            <i data-lucide="plus" class="h-4 w-4"></i>
          </button>
        </div>
        <button id="shuffleResults" class="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-sm font-semibold text-slate-600 ring-1 ring-slate-200 transition hover:bg-slate-50 active:scale-[.97] dark:text-slate-300 dark:ring-slate-700 dark:hover:bg-slate-800">
          <i data-lucide="shuffle" class="h-4 w-4"></i>결과 섞기
        </button>
      </div>

      <div class="ml-auto flex flex-wrap gap-2">
        <button id="startBtn" class="inline-flex items-center gap-1.5 rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-500 active:scale-[.97]">
          <i data-lucide="play" class="h-4 w-4"></i>시작
        </button>
        <button id="revealAll" class="hidden items-center gap-1.5 rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-500 active:scale-[.97] disabled:opacity-40">
          <i data-lucide="eye" class="h-4 w-4"></i>모두 공개
        </button>
        <button id="newLadder" class="hidden items-center gap-1.5 rounded-xl px-3.5 py-2 text-sm font-semibold text-slate-600 ring-1 ring-slate-200 transition hover:bg-slate-50 active:scale-[.97] dark:text-slate-300 dark:ring-slate-700 dark:hover:bg-slate-800">
          <i data-lucide="refresh-cw" class="h-4 w-4"></i>새 사다리
        </button>
        <button id="resetBtn" class="hidden items-center gap-1.5 rounded-xl px-3.5 py-2 text-sm font-semibold text-slate-600 ring-1 ring-slate-200 transition hover:bg-slate-50 active:scale-[.97] dark:text-slate-300 dark:ring-slate-700 dark:hover:bg-slate-800">
          <i data-lucide="rotate-ccw" class="h-4 w-4"></i>다시 설정
        </button>
      </div>
    </div>

    <!-- 사다리 -->
    <div class="-mx-4 overflow-x-auto px-4 sm:mx-0 sm:px-0">
      <div id="board" class="mx-auto">
        <div id="top" class="grid gap-2"></div>
        <div class="relative my-3">
          <svg id="ladder" class="block h-72 w-full text-slate-300 dark:text-slate-700 sm:h-96"></svg>
          <div id="hint" class="pointer-events-none absolute inset-0 grid place-items-center">
            <span class="flex items-center gap-2 rounded-full bg-white/90 px-4 py-2 text-sm font-medium text-slate-500 shadow-sm ring-1 ring-slate-200 backdrop-blur dark:bg-slate-900/90 dark:text-slate-400 dark:ring-slate-700">
              <i data-lucide="eye-off" class="h-4 w-4"></i>시작을 누르면 사다리가 만들어져요
            </span>
          </div>
        </div>
        <div id="bottom" class="grid gap-2"></div>
      </div>
    </div>
  </section>

  <!-- 결과 요약 -->
  <section id="summaryBox" class="mt-6 hidden rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800 sm:p-6">
    <h2 class="mb-3 flex items-center gap-2 text-base font-bold">
      <i data-lucide="trophy" class="h-5 w-5 text-amber-500"></i>결과
    </h2>
    <ul id="summary" class="grid gap-2 sm:grid-cols-2"></ul>
  </section>

  <p class="mt-6 text-center text-xs text-slate-400 dark:text-slate-500">위쪽 이름을 누르면 한 명씩 사다리를 타요</p>
</main>

<script>
(() => {
  const COLORS = ['#6366f1','#f43f5e','#10b981','#f59e0b','#0ea5e9','#a855f7','#ec4899','#14b8a6','#f97316','#84cc16','#ef4444','#06b6d4'];
  const MIN = 2, MAX = 12, LEVELS = 12;
  const NS = 'http://www.w3.org/2000/svg';

  const S = {
    n: 4,
    names: [],
    results: [],
    phase: 'edit',          // edit | play
    rungs: [],              // rungs[level][i] : i와 i+1 사이 가로줄
    map: [],                // map[참가자] = 도착 칸
    done: new Set(),
    running: new Map(),
    order: [],
  };

  const $ = id => document.getElementById(id);
  const svg = $('ladder');
  const color = i => COLORS[i % COLORS.length];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const icons = () => window.lucide && lucide.createIcons();

  function fillDefaults() {
    for (let i = 0; i < S.n; i++) {
      if (S.names[i] == null) S.names[i] = `참가자 ${i + 1}`;
      if (S.results[i] == null) S.results[i] = i === 0 ? '당첨' : '꽝';
    }
  }

  // ---------- 사다리 생성 ----------
  function genLadder() {
    const n = S.n, r = [];
    for (let l = 0; l < LEVELS; l++) {
      const row = Array(n - 1).fill(false);
      for (let i = 0; i < n - 1; i++) {
        if (!(i > 0 && row[i - 1]) && Math.random() < 0.42) row[i] = true;
      }
      r.push(row);
    }
    // 모든 세로줄 사이에 가로줄이 최소 하나는 있게
    for (let i = 0; i < n - 1; i++) {
      if (r.some(row => row[i])) continue;
      const cand = [];
      for (let l = 0; l < LEVELS; l++) if (!r[l][i - 1] && !r[l][i + 1]) cand.push(l);
      if (cand.length) r[cand[Math.floor(Math.random() * cand.length)]][i] = true;
    }
    S.rungs = r;
    S.map = Array.from({ length: n }, (_, i) => walk(i).end);
  }

  function walk(start, g) {
    let c = start;
    const pts = g ? [[g.x(c), g.top]] : null;
    for (let l = 0; l < LEVELS; l++) {
      const row = S.rungs[l];
      let next = c;
      if (row[c]) next = c + 1;
      else if (c > 0 && row[c - 1]) next = c - 1;
      if (next !== c && g) { pts.push([g.x(c), g.y(l)], [g.x(next), g.y(l)]); }
      c = next;
    }
    if (g) pts.push([g.x(c), g.bottom]);
    return { pts, end: c };
  }

  function geo() {
    const w = svg.clientWidth || 600, h = svg.clientHeight || 360, pad = 6;
    return {
      w, h, top: pad, bottom: h - pad,
      x: c => w * (c + 0.5) / S.n,
      y: l => pad + (h - pad * 2) * (l + 1) / (LEVELS + 1),
    };
  }

  // ---------- 그리기 ----------
  function drawLadder() {
    // 진행 중인 애니메이션은 즉시 끝냄
    for (const [i, job] of S.running) {
      cancelAnimationFrame(job.raf);
      S.running.delete(i);
      S.done.add(i); S.order.push(i);
    }

    const g = geo();
    svg.setAttribute('viewBox', `0 0 ${g.w} ${g.h}`);
    let html = '';
    for (let c = 0; c < S.n; c++) {
      html += `<line x1="${g.x(c)}" y1="${g.top}" x2="${g.x(c)}" y2="${g.bottom}" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>`;
    }
    if (S.phase === 'play') {
      S.rungs.forEach((row, l) => row.forEach((on, i) => {
        if (on) html += `<line x1="${g.x(i)}" y1="${g.y(l)}" x2="${g.x(i + 1)}" y2="${g.y(l)}" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>`;
      }));
      for (const i of S.done) {
        const pts = walk(i, g).pts.map(p => p.join(',')).join(' ');
        html += `<polyline points="${pts}" fill="none" stroke="${color(i)}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
      }
    }
    svg.innerHTML = html;
    $('hint').classList.toggle('hidden', S.phase === 'play');
  }

  function renderTop() {
    const top = $('top');
    top.style.gridTemplateColumns = `repeat(${S.n}, minmax(0, 1fr))`;
    top.innerHTML = S.names.slice(0, S.n).map((nm, i) => {
      const col = color(i);
      if (S.phase === 'edit') {
        return `<input data-k="names" data-i="${i}" value="${esc(nm)}" maxlength="10" aria-label="참가자 ${i + 1} 이름"
          class="w-full min-w-0 rounded-lg border-0 bg-slate-100 px-2 py-2.5 text-center text-sm font-semibold outline-none ring-1 ring-inset ring-slate-200 transition focus:bg-white focus:ring-2 focus:ring-indigo-500 dark:bg-slate-800 dark:ring-slate-700 dark:focus:bg-slate-900"
          style="box-shadow: inset 0 -3px 0 ${col}">`;
      }
      const done = S.done.has(i), run = S.running.has(i);
      const style = done || run
        ? `background:${col};color:#fff;`
        : `box-shadow: inset 0 -3px 0 ${col};`;
      return `<button data-play="${i}" ${done ? 'disabled' : ''}
        class="flex w-full min-w-0 items-center justify-center gap-1 truncate rounded-lg px-2 py-2.5 text-sm font-semibold ring-1 ring-inset ring-slate-200 transition hover:-translate-y-0.5 hover:shadow-md disabled:translate-y-0 disabled:shadow-none dark:ring-slate-700 ${run ? 'animate-pulse' : ''} ${done || run ? '' : 'bg-white dark:bg-slate-800'}"
        style="${style}"><span class="truncate">${esc(nm || `참가자 ${i + 1}`)}</span></button>`;
    }).join('');
  }

  function renderBottom() {
    const bottom = $('bottom');
    bottom.style.gridTemplateColumns = `repeat(${S.n}, minmax(0, 1fr))`;
    const owner = {};
    for (const i of S.done) owner[S.map[i]] = i;

    bottom.innerHTML = S.results.slice(0, S.n).map((rs, c) => {
      if (S.phase === 'edit') {
        return `<input data-k="results" data-i="${c}" value="${esc(rs)}" maxlength="10" aria-label="결과 ${c + 1}"
          class="w-full min-w-0 rounded-lg border-0 bg-amber-50 px-2 py-2.5 text-center text-sm font-semibold outline-none ring-1 ring-inset ring-amber-200 transition focus:bg-white focus:ring-2 focus:ring-amber-500 dark:bg-amber-500/10 dark:ring-amber-500/30 dark:focus:bg-slate-900">`;
      }
      if (c in owner) {
        return `<div class="flex min-w-0 items-center justify-center rounded-lg px-2 py-2.5 text-center text-sm font-bold text-white shadow-sm"
          style="background:${color(owner[c])}"><span class="truncate">${esc(rs || '-')}</span></div>`;
      }
      return `<div class="grid place-items-center rounded-lg bg-slate-100 py-2.5 text-slate-400 ring-1 ring-inset ring-slate-200 dark:bg-slate-800 dark:text-slate-500 dark:ring-slate-700">
        <i data-lucide="gift" class="h-5 w-5"></i></div>`;
    }).join('');
  }

  function renderSummary() {
    const box = $('summaryBox');
    box.classList.toggle('hidden', S.phase !== 'play');
    if (S.phase !== 'play') return;
    $('summary').innerHTML = S.order.length
      ? S.order.map(i => `
        <li class="flex items-center gap-3 rounded-xl bg-slate-50 px-3 py-2.5 dark:bg-slate-800/60">
          <span class="h-3 w-3 shrink-0 rounded-full" style="background:${color(i)}"></span>
          <span class="truncate font-semibold">${esc(S.names[i] || `참가자 ${i + 1}`)}</span>
          <i data-lucide="arrow-right" class="h-4 w-4 shrink-0 text-slate-400"></i>
          <span class="ml-auto truncate font-bold" style="color:${color(i)}">${esc(S.results[S.map[i]] || '-')}</span>
        </li>`).join('')
      : `<li class="text-sm text-slate-500 dark:text-slate-400">위쪽 이름을 누르면 결과가 여기에 쌓여요</li>`;
  }

  function renderTools() {
    const play = S.phase === 'play';
    $('editTools').classList.toggle('hidden', play);
    $('count').textContent = S.n;
    $('minus').disabled = S.n <= MIN;
    $('plus').disabled = S.n >= MAX;
    $('startBtn').classList.toggle('hidden', play);
    for (const id of ['revealAll', 'newLadder', 'resetBtn']) {
      $(id).classList.toggle('hidden', !play);
      $(id).classList.toggle('inline-flex', play);
    }
    $('revealAll').disabled = S.done.size + S.running.size >= S.n;
    $('subtitle').textContent = play
      ? '이름을 눌러 사다리를 타 보세요'
      : '이름과 결과를 적고 시작을 눌러 보세요';
    $('board').style.minWidth = `${S.n * 72}px`;
  }

  function renderAll() {
    fillDefaults();
    renderTools();
    renderTop();
    renderBottom();
    drawLadder();
    renderSummary();
    icons();
  }

  function refreshAfterTrace() {
    renderTools(); renderTop(); renderBottom(); renderSummary(); icons();
  }

  // ---------- 사다리 타기 애니메이션 ----------
  function trace(i) {
    if (S.phase !== 'play' || S.done.has(i) || S.running.has(i)) return;
    const g = geo();
    const pts = walk(i, g).pts.map(p => p.join(',')).join(' ');

    const line = document.createElementNS(NS, 'polyline');
    line.setAttribute('points', pts);
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', color(i));
    line.setAttribute('stroke-width', '6');
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('stroke-linejoin', 'round');
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('r', '9');
    dot.setAttribute('fill', color(i));
    dot.setAttribute('stroke', '#fff');
    dot.setAttribute('stroke-width', '3');
    svg.append(line, dot);

    const len = line.getTotalLength();
    line.style.strokeDasharray = len;
    line.style.strokeDashoffset = len;
    const dur = Math.min(2600, Math.max(1100, len * 1.6));
    const t0 = performance.now();
    const job = { raf: 0 };
    S.running.set(i, job);

    const tick = now => {
      const t = Math.min(1, (now - t0) / dur);
      const p = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      line.style.strokeDashoffset = len * (1 - p);
      const pt = line.getPointAtLength(len * p);
      dot.setAttribute('cx', pt.x);
      dot.setAttribute('cy', pt.y);
      if (t < 1) { job.raf = requestAnimationFrame(tick); return; }
      // 완료: 다른 진행 중인 선은 건드리지 않도록 이 선만 정리
      dot.remove();
      line.style.strokeDasharray = '';
      line.style.strokeDashoffset = '';
      S.running.delete(i);
      S.done.add(i);
      S.order.push(i);
      refreshAfterTrace();
    };
    job.raf = requestAnimationFrame(tick);
    refreshAfterTrace();
  }

  // ---------- 이벤트 ----------
  function startGame() {
    for (let i = 0; i < S.n; i++) {
      S.names[i] = (S.names[i] || '').trim() || `참가자 ${i + 1}`;
      S.results[i] = (S.results[i] || '').trim() || '-';
    }
    S.phase = 'play';
    resetProgress();
    genLadder();
    renderAll();
  }

  function resetProgress() {
    for (const job of S.running.values()) cancelAnimationFrame(job.raf);
    S.running.clear();
    S.done.clear();
    S.order = [];
  }

  $('minus').onclick = () => { if (S.n > MIN) { S.n--; renderAll(); } };
  $('plus').onclick = () => { if (S.n < MAX) { S.n++; renderAll(); } };
  $('shuffleResults').onclick = () => {
    const arr = S.results.slice(0, S.n);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    S.results.splice(0, S.n, ...arr);
    renderBottom();
  };
  $('startBtn').onclick = startGame;
  $('newLadder').onclick = () => { resetProgress(); genLadder(); renderAll(); };
  $('resetBtn').onclick = () => { resetProgress(); S.phase = 'edit'; renderAll(); };
  $('revealAll').onclick = () => {
    let delay = 0;
    for (let i = 0; i < S.n; i++) {
      if (S.done.has(i) || S.running.has(i)) continue;
      setTimeout(() => trace(i), delay);
      delay += 350;
    }
  };

  $('top').addEventListener('click', e => {
    const b = e.target.closest('[data-play]');
    if (b) trace(+b.dataset.play);
  });
  for (const id of ['top', 'bottom']) {
    $(id).addEventListener('input', e => {
      const el = e.target;
      if (el.dataset.k) S[el.dataset.k][+el.dataset.i] = el.value;
    });
    $(id).addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') startGame();
    });
  }

  let resizeTimer = 0;
  new ResizeObserver(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const hadRunning = S.running.size > 0;
      drawLadder();
      if (hadRunning) refreshAfterTrace();
    }, 80);
  }).observe(svg);

  renderAll();
})();
</script>
</body>
</html>
